<div class="content">
    <h3>Student List</h3>
    <table border="1">
        <thead>
            <tr>
                <th>#</th>
                <th>Student ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Section</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
                <td>{{ student[4] }}</td>
                <td>{{ student[5] }}</td>
                <td>
                    <form action="/update" method="POST">
                        <input type="hidden" name="student_id" value="{{ student[1] }}">
                        <input type="hidden" name="student_name" value="{{ student[2] }}">
                        <input type="hidden" name="age" value="{{ student[3] }}">
                        <input type="hidden" name="section" value="{{ student[4] }}">
                        <input type="hidden" name="course" value="{{ student[5] }}">
                        <input type="submit" value="Update">
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
