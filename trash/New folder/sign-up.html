<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style(signup).css') }}" />
</head>
<body>

    <!-- Jinja -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class="flash-messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    {% endwith %}


    <form action="signup_process" method="POST">
        <div class="login-wrap">
            <div class="login-html" style="margin-top: 0px;">
                <div class="buttom"><a href="/"></i> Back to login</a>
                </div>
                <div class="container">
                    <input id="tab-2" type="radio" name="tab" class="sign-up"checked>
                    <label for="tab-2" class="tab">SignUp</label>
                    <div class="login-form">
                        <div class="sign-up-htm">
                            <div class="group">
                                <label for="user" class="label">School Number</label>
                                <input id="user" type="text" class="input" name="student_ID" placeholder="Enter school number">
                            </div>
                            <div class="group">
                                <label for="user" class="label">Name</label>
                                <input id="pass" 
                                type="text" 
                                class="input" 
                                placeholder="Enter name" 
                                name="name">
                            </div>
                            <div class="group">
                                <label for="pass" class="label">Password</label>
                                <input id="pass" 
                                type="password" 
                                class="input" 
                                data-type="password" 
                                placeholder="Enter password" 
                                name="password">
                            </div>
                            <div class="group">
                                <label for="pass" class="label">Confirm Password</label>
                                <input id="pass" 
                                type="password" 
                                class="input" 
                                data-type="password"
                                placeholder="Confirm password" 
                                name="confirm_password">
                            </div>
                            <div class="group">
                                <label for="pass" class="label">Email Address</label>
                                <input id="pass" type="text" class="input" name="email" placeholder="Enter  email">

                            </div>
                            <div class="group">
                                <input type="submit" class="button" value="Sign Up">
                            </div>
                            <div class="hr"></div>
                            <div class="foot-lnk">
                                <a href="/">Already Member?</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.4.1/gsap.min.js'>

                gsap.from('div', { opacity: 0, duration: 1, y: -50 })

            </script>
    </form>

</body>
</html>
