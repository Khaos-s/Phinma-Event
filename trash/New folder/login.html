<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style(login).css') }}" />
</head>
<body>

    <!-- Jinja -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class="flash-messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    {% endwith %}

    <form action="login_process" method="POST">
        <div class="login-wrap">
            <div class="login-html">
                <div class="container">
                    <input id="tab-1" type="radio" name="tab" class="sign-in" checked>
                    <label for="tab-1" class="tab">Log In</label>
                    <input id="tab-2" type="radio" name="tab" class="sign-up">
                    <label for="tab-2" class="tab"></label>
                    <div class="login-form">
                            <div class="group">
                                <label for="user" class="label">Email</label>
                                <input id="user" type="text" class="input" name="email">
                            </div>
                            <div class="group">
                                <label for="pass" class="label">Password</label>
                                <input id="pass" type="password" class="input" data-type="password" name="password">
                            </div>
                            <div class="group">
                                <input id="check" type="checkbox" class="check" checked>
                                <label for="check"><span class="icon"></span> Keep me Signed in</label>
                            </div>
                            <div class="group">
                                <button type="submit" class="button" value="Login">Login</button>
                            </div>
                            <div class="hr"></div>
                            <div class="foot-lnk">
                                <a href="/signup">Don't have an account?</a>
                            </div>
                            <div class="terms">
                                <p>© 2024 PHINMA WEBCITE</p>
                                <p>
                                    <span>Terms of Service </span>|<span> Privacy Policy</span>
                                </p>
                                
                            </div>
                        </div>

                        <div class="sign-up-htm">
                            
                        </div>
                    </div>
                </div>
            </div>

            <script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.4.1/gsap.min.js'>

                gsap.from('div', { opacity: 0, duration: 1, y: -50 })

            </script>
    </form>

</body>
</html>
