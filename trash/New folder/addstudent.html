<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style(signup).css') }}">
</head>
<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
  <ul>
      {% for message in messages %}
          <li>{{ message }}</li>
      {% endfor %}
  </ul>
      {% endif %}
  {% endwith %}

    <div class="signup-box">
        <a href="{{url_for('home')}}"><i class="fa-solid fa-house"></i></a>
        <h1>Adding  a new Student</h1>
        <form action="/adding" method="post">
          <label>School ID</label>
          <input type="text" placeholder="" name="school_id"/ required>
          <label>Name</label>
          <input type="text" placeholder="" name="namefield"/ required>
          <label>Age</label>
          <input type="number" placeholder="" name="age_id"/>
          <label>School Email</label>
          <input type="email" placeholder="" name="email_id"/ required>
          <label>Course</label>
          <input type="text" placeholder="" name="course_id"/ required>
          <button type="submit">Add</button>
          
        </form>
      </div>
</body>
</html>
